<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>kit example</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* The canvas is sized by CSS and read back by Engine.resize(); never set
         width/height attributes on it directly or DPR handling breaks. */
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
      #ui { position: fixed; inset: 0; pointer-events: none; font: 12px/1.4 ui-monospace, monospace; color: #cfd6dd; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
